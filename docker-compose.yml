name: misa-lol

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./templates:/srv/templates:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tunnel_ingress
      - app

  frontend:
    build:
      context: ./frontend
      args:
        API_PROXY_TARGET: http://api:8000
        NEXT_PUBLIC_MEDIA_HOSTS: "${NEXT_PUBLIC_MEDIA_HOSTS:-r2.misa.lol}"
        MISA_NEXT_CORE_ROLLOUT: "${MISA_NEXT_CORE_ROLLOUT:-false}"
    restart: unless-stopped
    user: "node"
    environment:
      NODE_ENV: production
      MISA_BACKEND_URL: http://api:8000
      MISA_NEXT_CORE_READS: "true"
      MISA_NEXT_CORE_ROLLOUT: "${MISA_NEXT_CORE_ROLLOUT:-false}"
      MISA_INSTANCE_NAME: frontend
      MISA_APP_NAME: misa
      MISA_APP_VERSION: 0.1.0
      MISA_ENVIRONMENT: "${MISA_ENVIRONMENT:-production}"
      MISA_DOMAIN: "${MISA_DOMAIN:-misa.lol}"
      MISA_PUBLIC_BASE_URL: "${MISA_PUBLIC_BASE_URL:-https://misa.lol}"
      MISA_ADMIN_PUBLIC_URL: "${MISA_ADMIN_PUBLIC_URL:-https://ukvhq.dev/m}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      DRAGONFLY_URL: redis://dragonfly:6379/0
      MISA_ADMIN_USER_IDS: "${MISA_ADMIN_USER_IDS:-}"
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:?Set SUPER_ADMIN_EMAIL in .env}"
      MISA_ADMIN_TOKEN_SECRET: "${MISA_ADMIN_TOKEN_SECRET:?Set MISA_ADMIN_TOKEN_SECRET in .env}"
      MISA_EMAIL_API_URL: "${MISA_EMAIL_API_URL:-}"
      MISA_EMAIL_API_KEY: "${MISA_EMAIL_API_KEY:-}"
      MISA_EMAIL_FROM: "${MISA_EMAIL_FROM:-Misa.lol <no-reply@misa.lol>}"
      DATA_API_KEY: "${DATA_API_KEY:-}"
      MISA_GOOGLE_CLIENT_ID: "${MISA_GOOGLE_CLIENT_ID:-}"
      MISA_GOOGLE_CLIENT_SECRET: "${MISA_GOOGLE_CLIENT_SECRET:-}"
      MISA_DISCORD_CLIENT_ID: "${MISA_DISCORD_CLIENT_ID:-}"
      MISA_DISCORD_CLIENT_SECRET: "${MISA_DISCORD_CLIENT_SECRET:-}"
      DISCORD_SERVER_INVITE: "${DISCORD_SERVER_INVITE:-${MISA_DISCORD_SERVER_INVITE:-}}"
      MISA_TELEGRAM_BOT_TOKEN: "${MISA_TELEGRAM_BOT_TOKEN:-}"
      MISA_TELEGRAM_BOT_USERNAME: "${MISA_TELEGRAM_BOT_USERNAME:-}"
      MISA_TURNSTILE_SITE_KEY: "${MISA_TURNSTILE_SITE_KEY:-}"
      MISA_TURNSTILE_SECRET_KEY: "${MISA_TURNSTILE_SECRET_KEY:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_PUBLIC_BASE_URL: "${R2_PUBLIC_BASE_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started
      api:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - app
      - data
      - frontend_egress
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/dashboard').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build:
      context: ./backend
    restart: unless-stopped
    user: "nobody"
    environment:
      MISA_INSTANCE_NAME: api
      MISA_APP_NAME: misa
      MISA_APP_VERSION: 0.1.0
      MISA_ENVIRONMENT: "${MISA_ENVIRONMENT:-production}"
      MISA_DEBUG: "false"
      MISA_DOMAIN: "${MISA_DOMAIN:-misa.lol}"
      MISA_PUBLIC_BASE_URL: "${MISA_PUBLIC_BASE_URL:-https://misa.lol}"
      MISA_ADMIN_PUBLIC_URL: "${MISA_ADMIN_PUBLIC_URL:-https://ukvhq.dev/m}"
      MISA_CORS_ORIGINS: "${MISA_CORS_ORIGINS:-https://misa.lol,https://www.misa.lol,https://ukvhq.dev}"
      MISA_TRUSTED_HOSTS: "${MISA_TRUSTED_HOSTS:-misa.lol,www.misa.lol,ukvhq.dev,localhost,127.0.0.1,api}"
      MISA_MEDIA_FETCH_HOSTS: "${MISA_MEDIA_FETCH_HOSTS:-}"
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      MISA_ADMIN_USER_IDS: "${MISA_ADMIN_USER_IDS:-}"
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:?Set SUPER_ADMIN_EMAIL in .env}"
      MISA_ADMIN_TOKEN_SECRET: "${MISA_ADMIN_TOKEN_SECRET:?Set MISA_ADMIN_TOKEN_SECRET in .env}"
      MISA_EMAIL_API_URL: "${MISA_EMAIL_API_URL:-}"
      MISA_EMAIL_API_KEY: "${MISA_EMAIL_API_KEY:-}"
      MISA_EMAIL_FROM: "${MISA_EMAIL_FROM:-Misa.lol <no-reply@misa.lol>}"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      DATA_API_URL: http://data-api:8080
      DATA_API_KEY: "${DATA_API_KEY:?Set DATA_API_KEY in .env}"
      DRAGONFLY_URL: redis://dragonfly:6379/0
      MISA_GOOGLE_CLIENT_ID: "${MISA_GOOGLE_CLIENT_ID:-}"
      MISA_GOOGLE_CLIENT_SECRET: "${MISA_GOOGLE_CLIENT_SECRET:-}"
      MISA_DISCORD_CLIENT_ID: "${MISA_DISCORD_CLIENT_ID:-}"
      MISA_DISCORD_CLIENT_SECRET: "${MISA_DISCORD_CLIENT_SECRET:-}"
      MISA_DISCORD_SERVER_INVITE: "${MISA_DISCORD_SERVER_INVITE:-}"
      MISA_TELEGRAM_BOT_TOKEN: "${MISA_TELEGRAM_BOT_TOKEN:-}"
      MISA_TELEGRAM_BOT_USERNAME: "${MISA_TELEGRAM_BOT_USERNAME:-}"
      MISA_TURNSTILE_SITE_KEY: "${MISA_TURNSTILE_SITE_KEY:-}"
      MISA_TURNSTILE_SECRET_KEY: "${MISA_TURNSTILE_SECRET_KEY:-}"
      TURNSTILE_SITE_KEY: "${MISA_TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${MISA_TURNSTILE_SECRET_KEY:-}"
      R2_BUCKET: "${R2_BUCKET:-}"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID:-}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY:-}"
      R2_ENDPOINT: "${R2_ENDPOINT:-}"
      R2_PUBLIC_BASE_URL: "${R2_PUBLIC_BASE_URL:-}"
      MISA_SUPABASE_URL: "${MISA_SUPABASE_URL:-}"
      MISA_SUPABASE_SERVICE_ROLE_KEY: "${MISA_SUPABASE_SERVICE_ROLE_KEY:-}"
      MISA_STORAGE_BUCKET: "${MISA_STORAGE_BUCKET:-misa-assets}"
      R2_ACCOUNT_ID: "${R2_ACCOUNT_ID:-}"
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      data-api:
        condition: service_healthy
      dragonfly:
        condition: service_started
    expose:
      - "8000"
    networks:
      - app
      - data
      - api_egress
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  data-api:
    build:
      context: ./backend/data-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL in .env}"
      DATABASE_MAX_CONNECTIONS: "${DATABASE_MAX_CONNECTIONS:-5}"
      DATA_API_KEY: "${DATA_API_KEY:?Set DATA_API_KEY in .env}"
      LISTEN_ADDR: 0.0.0.0:8080
      RUST_LOG: "${RUST_LOG:-info}"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - data
      - data_api_egress
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  discord-bot:
    build:
      context: ./backend/discord-bot
    restart: unless-stopped
    environment:
      MISA_DISCORD_BOT_TOKEN: "${MISA_DISCORD_BOT_TOKEN:-}"
      MISA_DISCORD_GUILD_ID: "${MISA_DISCORD_GUILD_ID:-}"
      DRAGONFLY_URL: redis://dragonfly:6379/0
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    depends_on:
      dragonfly:
        condition: service_started
    networks:
      - data
      - bot_egress
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, os; sys.exit(0 if os.path.exists('/proc/1/cmdline') else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.26.0
    restart: unless-stopped
    volumes:
      - dragonfly_data:/data
    networks:
      - data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: misa
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d misa"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  tunnel_ingress:
    driver: bridge
  app:
    driver: bridge
    internal: true
  data:
    driver: bridge
    internal: true
  api_egress:
    driver: bridge
  frontend_egress:
    driver: bridge
  data_api_egress:
    driver: bridge
  bot_egress:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  dragonfly_data:
  postgres_data:
